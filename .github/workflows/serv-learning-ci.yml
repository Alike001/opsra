name: ServSteps learning companion
on:
  push:
    branches:
      - feat/serv-learning-companion
  pull_request:
jobs:
  test-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check learn/server.mjs && node --check learn/curriculum.mjs && node --check learn/mentor.mjs && node --check learn/public/app.js
      - run: node --test learn/test/*.test.mjs
